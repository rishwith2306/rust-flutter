[package]
name = "rust-flutter-material-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
system-theme-showcase = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-flutter = { path = "../../crates/rust-flutter" }

[package.metadata.android]
package = "dev.rustflutter.material"
apk_name = "rust-flutter-material"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|fontScale|layoutDirection|locale|uiMode"
