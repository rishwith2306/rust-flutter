[package]
name = "rust-flutter-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-flutter = { path = "../../crates/rust-flutter" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
rust-flutter-assets = { path = "../../crates/rust-flutter-assets", features = ["build"] }

[package.metadata.android]
package = "dev.rustflutter.gallery"
apk_name = "rust-flutter-gallery"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|screenLayout|density|fontScale|layoutDirection|locale|uiMode"
