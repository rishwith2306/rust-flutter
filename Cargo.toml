[workspace]
members = ["crates/rust-flutter", "crates/rust-flutter-assets", "examples/gallery", "examples/cupertino", "examples/material", "crates/rust-flutter-cli"]
resolver = "2"
exclude = ["vendor/wgpu-hal"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/rishwith2306/rust-flutter"

[workspace.dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "android-native-activity"] }
egui = { version = "=0.33.3", features = ["default_fonts"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
