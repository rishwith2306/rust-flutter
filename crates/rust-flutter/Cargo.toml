[package]
name = "rust-flutter"
description = "Experimental Rust application framework for desktop and Android"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
eframe.workspace = true
egui.workspace = true
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "metal", "gles"] }
# Keep the root renderer patch eligible during a fresh app resolution.
wgpu-hal = { version = "=27.0.4", default-features = false }
unicode-linebreak = "=0.1.5"
fluent-bundle = "0.16.0"
fluent-langneg = { version = "0.13.1", features = ["cldr"] }
unic-langid = "0.9.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rust-flutter-assets = { path = "../rust-flutter-assets", version = "0.1.0" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
accesskit_android = { version = "=0.4.2", features = ["embedded-dex"] }
egui-winit = { version = "=0.33.3", default-features = false, features = ["accesskit"] }
jni = "0.22.4"
pollster = "0.4"
raw-window-handle = "0.6"

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { workspace = true, features = ["accesskit"] }
