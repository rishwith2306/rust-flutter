name: Framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev xvfb xdotool imagemagick mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
      - name: Asset bundle Cargo rebuild check
        run: python3 scripts/asset-build-smoke.py
      - name: Generated project check
        shell: bash
        run: |
          cargo run -p rust-flutter-cli -- create "$RUNNER_TEMP/generated-app" --framework-path "$GITHUB_WORKSPACE"
          cargo check --manifest-path "$RUNNER_TEMP/generated-app/Cargo.toml"
      - name: Linux rendered interaction and restoration test
        if: runner.os == 'Linux'
        run: |
          cargo build -p rust-flutter-gallery --locked
          python3 scripts/desktop-smoke.py
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && always()
        with:
          name: desktop-smoke
          path: target/smoke/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Link Android shared library
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          cargo build -p rust-flutter-gallery --lib --target aarch64-linux-android --locked
          cargo clippy -p rust-flutter --target aarch64-linux-android --locked -- -D warnings
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - run: cargo install cargo-apk --version 0.10.0 --locked
      - name: Build ordinary native gallery APK
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          cargo metadata --locked --format-version 1 > /dev/null
          cargo apk build -p rust-flutter-gallery --lib --target x86_64-linux-android
      - name: Enable KVM for the isolated emulator
        run: sudo chmod a+rw /dev/kvm
      - name: Same-process activity recreation and final destruction
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: RustFlutterSmoke
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/android-recreation.py --serial emulator-5554 --cycles 3 --stop-pixel-launcher
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-smoke
          path: target/smoke/
